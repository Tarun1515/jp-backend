<!--
  Placeholders: {{UserName}} {{OtpCode}} {{ValidityMinutes}}
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background:#f4f5f7;padding:24px 0;font-family:Segoe UI,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0"
             style="background:#ffffff;border-radius:8px;padding:32px;max-width:560px;">
        <tr>
          <td style="font-size:20px;font-weight:600;color:#1a1a1a;padding-bottom:16px;">
            Your verification code
          </td>
        </tr>
        <tr>
          <td style="font-size:15px;line-height:1.6;color:#40454d;padding-bottom:20px;">
            Hello {{UserName}},<br /><br />
            Use this code to verify your account:
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <div style="display:inline-block;background:#f1f5f9;border:1px solid #dbe1e8;
                        border-radius:6px;padding:14px 32px;font-size:30px;font-weight:700;
                        letter-spacing:8px;color:#1a1a1a;">
              {{OtpCode}}
            </div>
          </td>
        </tr>
        <tr>
          <td style="font-size:13px;line-height:1.6;color:#6b7280;border-top:1px solid #e5e7eb;padding-top:16px;">
            The code expires in {{ValidityMinutes}} minutes.
            Never share it with anyone — nobody from the Teacher Recruitment Portal
            will ever ask you for it.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
